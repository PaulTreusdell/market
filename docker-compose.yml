services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financial_market
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d financial_market"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
